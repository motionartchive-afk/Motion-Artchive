<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motion Artchive: animasi &amp; grafis</title>
<meta name="description" content="Motion Artchive: studio motion design dan grafis. Lihat karya, paket jasa video animasi, dan pesan lewat WhatsApp.">
<meta name="theme-color" content="#07080c">
<meta property="og:title" content="Motion Artchive"><meta property="og:description" content="Studio motion design dan grafis."><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme="dark"]{color-scheme:dark;--bg:#07080c;--sf:rgba(255,255,255,.06);--sf2:rgba(255,255,255,.11);--bd:rgba(255,255,255,.13);--t1:#f4f6fb;--t2:#a9afc0;--ac:#4dd6dd;--ac2:#7bf8dc;--r:20px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#07080c;--t1:#f4f6fb}}
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{background:radial-gradient(55% 45% at 12% 8%,rgba(77,214,221,.38),transparent 62%),radial-gradient(45% 40% at 88% 28%,rgba(90,100,255,.28),transparent 62%),radial-gradient(50% 40% at 50% 100%,rgba(255,110,90,.16),transparent 60%),#07080c;background-attachment:fixed;color:var(--t1);font:16px/1.6 'Instrument Sans',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,11,16,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.glass{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(20,22,32,.92)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,11,16,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--bd)}
nav{display:flex;align-items:center;gap:20px;height:64px}.sp{flex:1}
.brand{font:800 20px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:10px}.logo{height:30px;width:auto}.lk{color:var(--t2);font-size:15px}.lk:hover{color:var(--t1)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);color:var(--t1);font:600 15px 'Instrument Sans',sans-serif;cursor:pointer}
.btn:hover{background:var(--sf2)}.btn.pri{background:linear-gradient(90deg,var(--ac2),var(--ac));color:#042226;border-color:transparent;box-shadow:0 6px 24px rgba(77,214,221,.4)}.btn.sm{padding:8px 14px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,.th:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.025em;line-height:1.1}
h1{font-size:clamp(38px,6.4vw,72px);font-weight:800}h2{font-size:clamp(26px,4vw,40px);margin-bottom:8px}
.hero{display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center;padding:72px 0 40px}
.hero p{color:var(--t2);max-width:520px;margin:20px 0 28px;font-size:18px}.hero .btn{margin:0 8px 8px 0}
.tl{position:relative;padding:22px;display:grid;gap:14px;overflow:hidden}
.tr{height:46px;border-radius:12px;background:rgba(255,255,255,.05);position:relative}
.tr i{position:absolute;top:6px;bottom:6px;left:var(--l);width:var(--w);border-radius:9px;background:linear-gradient(90deg,rgba(77,214,221,.7),rgba(123,248,220,.55));border:1px solid rgba(255,255,255,.3)}
.tr b{position:absolute;top:50%;width:10px;height:10px;background:#fff;transform:translateY(-50%) rotate(45deg);left:var(--k)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ff6e5a;left:22px;box-shadow:0 0 14px #ff6e5a;animation:scrub 6s linear infinite}
@keyframes scrub{to{left:calc(100% - 24px)}}
.tl small{color:var(--t2);font-size:13px}
@media(prefers-reduced-motion:reduce){.ph{animation:none;left:45%}html{scroll-behavior:auto}}
section{padding:56px 0}.sub{color:var(--t2);margin-bottom:28px}.grid.plans{grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}.mou{margin-top:24px;padding:24px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mou h3{font-size:clamp(18px,2.4vw,22px);margin-bottom:6px}.mou p{max-width:620px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{overflow:hidden;display:flex;flex-direction:column}
.th{aspect-ratio:16/9;display:grid;place-items:center;position:relative;border:0;width:100%;color:inherit;background-size:cover;background-position:center}
button.th{cursor:pointer}
.play{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tag{position:absolute;left:12px;top:12px;padding:3px 10px;border-radius:999px;font-size:12px;background:rgba(0,0,0,.45)}
.cb{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}.mut{color:var(--t2);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:7px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);color:var(--t2);cursor:pointer;font:inherit;font-size:14px}.chip.on{color:var(--t1);border-color:var(--ac);background:rgba(77,214,221,.22)}
.plan{padding:28px 24px;display:flex;flex-direction:column;gap:14px;position:relative}
.plan.pop{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 18px 50px rgba(77,214,221,.35);transform:translateY(-6px)}
.price{font:800 32px 'Bricolage Grotesque',sans-serif}
.plan ul{list-style:none;padding:0;display:grid;gap:8px;color:var(--t2);font-size:15px;flex:1}.plan li::before{content:"✓ ";color:var(--ac2)}
.badge{position:absolute;top:-12px;left:24px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#06070a}
footer{padding:40px 0 56px;text-align:center;color:var(--t2);font-size:14px}footer a{text-decoration:underline}footer .btn{text-decoration:none}.fh{font-size:clamp(20px,3vw,26px);color:var(--t1)}.fs{margin-top:6px}.soc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 28px}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:rgba(3,4,8,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.modal.on{display:grid}
.mb{width:min(960px,100%);max-height:90%;overflow:auto;padding:24px;background:rgba(18,20,30,.94)}
.mb iframe,.mb video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000}
input,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--t1);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
label{display:grid;gap:6px;font-size:13px;color:var(--t2)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:12px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.panel{padding:22px;margin-bottom:18px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--bd);flex-wrap:wrap}.row:first-child{border-top:0}
.note{font-size:14px;color:var(--t2);padding:12px 16px;border-radius:14px;border:1px dashed var(--bd);margin-bottom:8px}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .25s}.card:hover{transform:translateY(-4px)}}
.pg{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));grid-auto-flow:dense}
.wk{position:relative;display:block;padding:0;color:inherit;text-align:left;overflow:hidden;cursor:pointer;aspect-ratio:16/10;font:inherit}
.wk.big{grid-column:1/-1;aspect-ratio:21/9}
.wk:focus-visible{outline:2px solid var(--ac2);outline-offset:3px}
.pz{position:absolute;inset:0;transition:transform .5s}.wk:hover .pz{transform:scale(1.04)}
.wm{position:absolute;right:8%;top:50%;width:34%;aspect-ratio:1;transform:translateY(-50%);background:var(--logo) center/contain no-repeat;opacity:.22}
.pv{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,transparent 40%,rgba(4,6,10,.88))}
.pm{position:absolute;left:20px;right:20px;bottom:18px;display:grid;gap:4px}
.pm b{font:800 clamp(18px,2.4vw,28px) 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}.pm small{color:var(--t2)}
.tag2{justify-self:start;padding:3px 12px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media(max-width:640px){.wk.big{aspect-ratio:16/10}}

${S.products.length?`<section id="toko"><h2>Toko templat animasi</h2><p class="sub">${STORE_LIVE?'Bayar sekali. Tautan source file dikirim otomatis setelah pembayaran terkonfirmasi.':'Pesan lewat WhatsApp. File dikirim setelah pembayaran dikonfirmasi.'}</p><div class="grid">${S.products.map(p=>`<div class="card glass"><div class="th" style="background:${p.thumb?`url(${p.thumb}) center/cover`:hue(p.id+3)}"></div><div class="cb"><h3 style="font-size:18px">${esc(p.title)}</h3><span class="mut">${esc(p.desc)}</span><div class="row"><b>${fmt(p.price)}</b>${STORE_LIVE?`<button class="btn pri sm" data-a="buy" data-i="${p.id}">Beli dan unduh</button>`:`<a class="btn pri sm" href="https://wa.me/${WA}?text=${encodeURIComponent('Halo, saya mau beli '+p.title)}" target="_blank" rel="noopener">Pesan lewat WhatsApp</a>`}</div></div></div>`).join('')}</div></section>`:''}</main>
<footer><div class="wrap"><h3 class="fh">Portofolio kami</h3><p class="fs">Lihat karya dan kabar terbaru kami di platform berikut.</p><div class="soc">${SOC.map(l=>`<a class="btn sm" href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]}</a>`).join('')}</div><p>${esc(S.brand)}</p></div></footer>`}
const row=(l,r)=>`<div class="row"><span>${l}</span>${r}</div>`;
const A={
pf:()=>`<div class="panel glass"><h3>Tambah video portofolio</h3><div class="fg"><label>URL video (YouTube, Vimeo, Google Drive, atau .mp4)<input id="pu" placeholder="https://"></label><label>Judul<input id="pt"></label><label>Kategori<input id="pc" placeholder="Logo Animation"></label><label>Poster (gambar, opsional)<input id="pf" type="file" accept="image/*"></label><label style="display:flex;gap:8px;align-items:center"><input id="pw" type="checkbox" style="width:auto">Karya utama (kartu lebar)</label></div><p id="pd1" class="mut" style="margin-bottom:12px"></p><button class="btn pri" data-a="addp">Simpan video</button></div><div class="panel glass">${S.portfolio.map(p=>row(`<b>${esc(p.title)}</b> <span class="mut">${esc(p.cat)}, ${(parse(p.url)||{}).p||'tautan tidak dikenali'}</span>`,`<button class="btn sm" data-a="delp" data-i="${p.id}">Hapus</button>`)).join('')||'<p class="mut">Belum ada video.</p>'}</div>`,
pr:()=>S.plans.map(p=>`<div class="panel glass"><div class="fg"><label>Nama paket<input data-f="name" data-i="${p.id}" value="${esc(p.name)}"></label><label>Harga (Rp)<input type="number" data-f="price" data-i="${p.id}" value="${p.price}"></label><label>Catatan harga<input data-f="note" data-i="${p.id}" value="${esc(p.note)}"></label><label>Tautan tombol pesan<input data-f="cta" data-i="${p.id}" value="${esc(p.cta)}"></label></div><label>Fitur teknis (satu per baris)<textarea rows="4" data-f="feat" data-i="${p.id}">${esc(p.feat.join('\n'))}</textarea></label><div class="row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" data-f="pop" data-i="${p.id}" ${p.pop?'checked':''}>Tandai sebagai paling populer</label><button class="btn sm" data-a="delr" data-i="${p.id}">Hapus paket</button></div></div>`).join('')+'<button class="btn pri" data-a="addr">Tambah paket</button>',
pd:()=>`<div class="panel glass"><h3>Tambah produk</h3><div class="fg"><label>Judul aset<input id="qt"></label><label>Harga (Rp)<input id="qp" type="number"></label><label>Thumbnail pratinjau (gambar)<input id="qf" type="file" accept="image/*"></label></div><label>Deskripsi teknis dan panduan resolusi<textarea id="qd" rows="3"></textarea></label><div class="fg"><label>URL source file (privat, tidak tampil di situs)<input id="qs" placeholder="https://"></label></div><button class="btn pri" data-a="addd">Simpan produk</button></div><div class="panel glass">${S.products.map(p=>row(`<b>${esc(p.title)}</b> <span class="mut">${fmt(p.price)}, source file tersembunyi dari publik</span>`,`<button class="btn sm" data-a="deld" data-i="${p.id}">Hapus</button>`)).join('')||'<p class="mut">Belum ada produk.</p>'}</div>`,
od:()=>`<div class="panel glass">${ORD.map(o=>row(`<b>${esc(o.title)}</b> <span class="mut">${esc(o.email)}, lunas, unduhan ${o.n} dari ${o.max}${o.rev?', dicabut':''}</span>`,`<span><button class="btn sm" data-a="dlp" data-t="${o.tok}">Halaman unduh</button> <button class="btn sm" data-a="rev" data-t="${o.tok}">${o.rev?'Pulihkan':'Cabut akses'}</button></span>`)).join('')||'<p class="mut">Belum ada pesanan. Coba beli produk di situs untuk mensimulasikan alurnya.</p>'}</div>`,
st:()=>`<div class="panel glass"><label>Nama studio<input id="sb" value="${esc(S.brand)}"></label><p style="margin-top:16px"><button class="btn" data-a="reset">Reset data demo</button></p></div>`};
function admin(){const T=[['pf','Portofolio'],['pr','Paket harga'],['pd','Produk'],['od','Pesanan'],['st','Pengaturan']].filter(t=>STORE_LIVE||t[0]!=='od');
return `<header><div class="wrap"><nav><span class="brand"><img class="logo" src="${LOGO}" alt="">${esc(S.brand)}</span><span class="mut">Dasbor admin</span><span class="sp"></span><a class="btn sm" href="#">Lihat situs</a></nav></div></header><main class="wrap"><section><h2>Dasbor admin</h2><div class="note">Halaman ini hanya muncul untuk pemilik. Pengunjung baru melihat perubahan setelah Anda menekan Terbitkan. Versi produksi memakai login sungguhan di peladen.</div><div class="panel glass" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn pri" data-a="pub">${art?'Terbitkan perubahan':'Unduh HTML terbaru'}</button><span id="ps" class="mut">${dirty?'Ada perubahan yang belum diterbitkan.':'Semua perubahan sudah terbit.'}</span></div><div class="tabs">${T.map(t=>`<button class="chip ${t[0]===tab?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${A[tab]()}</section></main>`}
const render=()=>{$('#app').innerHTML=view==='admin'?admin():site()};
const mod=h=>{$('#mb').innerHTML=h;$('#md').classList.add('on')},closeM=()=>{$('#md').classList.remove('on');$('#mb').innerHTML=''};
const shrink=f=>new Promise(r=>{if(!f)return r('');const fr=new FileReader;fr.onload=()=>{const i=new Image;i.onload=()=>{const k=Math.min(1,480/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>r('');i.src=fr.result};fr.onerror=()=>r('');fr.readAsDataURL(f)});
function dlPage(t,miss){const o=ORD.find(x=>x.tok===t),ok=o&&!o.rev&&o.n<o.max;
mod(ok?`<h3>${esc(o.title)}</h3><p class="mut" style="margin:10px 0 16px">Sisa unduhan: ${o.max-o.n} dari ${o.max}. Tautan penyimpanan asli tidak ditampilkan di halaman ini.</p>${miss?'<p class="mut" style="margin-bottom:12px">Ini demo: tautan source file asli hanya tersimpan di peladen pada versi produksi.</p>':''}<button class="btn pri" data-a="claim" data-t="${t}">Unduh source file</button>`:'<h3>Tautan tidak berlaku</h3><p class="mut" style="margin-top:10px">Tautan ini sudah kedaluwarsa, dicabut, atau kuota unduhannya habis.</p>')}
document.addEventListener('click',async e=>{if(e.target.id==='md')return closeM();const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,t=b.dataset.t;
if(a==='f'){filt=b.dataset.v;render()}
else if(a==='tab'){tab=b.dataset.v;render()}
else if(a==='play'){const p=S.portfolio.find(x=>x.id===i),v=parse(p.url);mod(`<h3>${esc(p.title)}</h3><div style="margin:14px 0">${v&&v.v?`<video src="${esc(v.e)}" controls playsinline></video>`:v?`<iframe ${v.f?'style="height:70vh;aspect-ratio:auto" ':''}src="${esc(v.e)}" allow="autoplay; fullscreen" allowfullscreen title="${esc(p.title)}"></iframe>`:''}</div><a class="btn sm" href="${safe(p.url)}" target="_blank" rel="noopener">Buka di tab baru</a>`)}
else if(a==='buy'){const p=S.products.find(x=>x.id===i);mod(`<h3>${esc(p.title)}</h3><p class="mut" style="margin:8px 0 16px">${fmt(p.price)}. Tautan unduhan dikirim ke email setelah pembayaran terkonfirmasi.</p><label>Email<input id="em" type="email" placeholder="nama@email.com"></label><p style="margin-top:16px"><button class="btn pri" data-a="pay" data-i="${i}">Bayar (simulasi)</button></p>`)}
else if(a==='pay'){const em=$('#em').value.trim();if(!/^\S+@\S+$/.test(em))return $('#em').focus();const p=S.products.find(x=>x.id===i),tk=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');ORD.unshift({id:Date.now(),email:em,pid:i,title:p.title,tok:tk,n:0,max:5,rev:0});saveOrd();mod(`<h3>Pembayaran terkonfirmasi</h3><p class="mut" style="margin:10px 0 16px">Webhook gateway (disimulasikan) menandai pesanan lunas. Sistem lalu mengirim email ke ${esc(em)} berisi tautan unduhan pribadi.</p><button class="btn pri" data-a="dlp" data-t="${tk}">Buka halaman unduh</button>`)}
else if(a==='dlp')dlPage(t);
else if(a==='claim'){const o=ORD.find(x=>x.tok===t);if(!o||o.rev||o.n>=o.max)return dlPage(t);o.n++;saveOrd();const pr=S.products.find(x=>x.id===o.pid),sr=pr&&(pr.source||SRC[pr.id]);if(sr)window.open(safe(sr),'_blank','noopener');dlPage(t,!sr)}
else if(a==='rev'){const o=ORD.find(x=>x.tok===t);o.rev=o.rev?0:1;saveOrd();render()}
else if(a==='addp'){const u=$('#pu').value.trim(),t2=$('#pt').value.trim();if(!parse(u)||!t2){$('#pd1').textContent='Isi judul dan gunakan URL YouTube, Vimeo, file atau folder Google Drive, atau .mp4.';return}const po=await shrink($('#pf').files[0]);S.portfolio.push({id:Date.now(),title:t2,cat:$('#pc').value.trim()||'Lainnya',url:u,poster:po,feat:$('#pw').checked?1:0});save();render()}
else if(a==='delp'){S.portfolio=S.portfolio.filter(x=>x.id!==i);save();render()}
else if(a==='addr'){S.plans.push({id:Date.now(),name:'Paket baru',price:0,note:'per video',feat:['Fitur pertama'],cta:'https://wa.me/6285768854197',pop:0});save();render()}
else if(a==='delr'){S.plans=S.plans.filter(x=>x.id!==i);save();render()}
else if(a==='addd'){const ti=$('#qt').value.trim();if(!ti)return $('#qt').focus();const th=await shrink($('#qf').files[0]);const id=Date.now(),src=$('#qs').value.trim();SRC[id]=src;S.products.push({id,title:ti,desc:$('#qd').value.trim(),price:+$('#qp').value||0,thumb:th,source:src});save();render()}
else if(a==='deld'){S.products=S.products.filter(x=>x.id!==i);save();render()}
else if(a==='gate'){const v=$('#pw1').value;if(v.length<6){$('#pwm').textContent='Minimal 6 karakter.';return}let hh;try{hh=await sha(v)}catch(x){$('#pwm').textContent='Browser ini tidak mendukung fitur ini. Buka lewat https atau localhost.';return}const st=localStorage.getItem('ma_pw');if(st&&st!==hh){$('#pwm').textContent='Kata sandi salah.';return}localStorage.setItem('ma_pw',hh);closeM();unlock()}
else if(a==='pub'){const st=$('#ps');st.textContent='Menyiapkan...';S.ver=Date.now();const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#mb').innerHTML='';c.querySelector('#md').className='modal';c.querySelector('#seed').textContent=JSON.stringify(pubState()).replace(/</g,'\\u003c');const html='<!doctype html>\n'+c.outerHTML;if(!art){const a2=document.createElement('a');a2.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a2.download='index.html';a2.click();st.textContent='File index.html terunduh. Unggah ke hosting Anda untuk menerapkan perubahan.';return}try{await art.publish(html)}catch(x){st.textContent='Gagal menerbitkan: '+((x&&(x.message||x.code))||'coba lagi')}}
else if(a==='reset'){try{localStorage.removeItem(K)}catch(x){}S=structuredClone(seed);render()}});
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='pu'){const v=parse(t.value);$('#pd1').textContent=t.value?(v?'Terdeteksi: '+v.p:'URL belum dikenali atau domain tidak diizinkan'):''}
else if(t.dataset.f){const p=S.plans.find(x=>x.id===+t.dataset.i),f=t.dataset.f;if(!p)return;p[f]=f==='feat'?t.value.split('\n').filter(Boolean):f==='price'?+t.value:f==='pop'?(t.checked?1:0):t.value;save()}
else if(t.id==='sb'){S.brand=t.value;save()}});
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
addEventListener('hashchange',()=>{const v=owner&&location.hash==='#admin'?'admin':'site';if(v!==view){view=v;render();scrollTo(0,0)}});
render();
document.documentElement.style.setProperty('--logo','url('+LOGO+')');
if(!document.querySelector('link[rel=icon]'))document.head.insertAdjacentHTML('beforeend','<link rel="icon" href="'+LOGO+'">');
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const unlock=()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.__base===(emb.ver||0)){delete d.__base;S=d}}catch(e){}S.products.forEach(p=>{p.source=SRC[p.id]||''});owner=true;if(location.hash==='#admin')view='admin';render()};
function standalone(){const gate=()=>{if(location.hash!=='#admin'||owner)return;const h=localStorage.getItem('ma_pw');mod(`<h3>${h?'Masuk admin':'Buat kata sandi admin'}</h3><p class="mut" style="margin:8px 0 14px">${h?'Masukkan kata sandi admin.':'Kata sandi ini disimpan di browser ini saja.'}</p><label>Kata sandi<input id="pw1" type="password" autocomplete="current-password"></label><p id="pwm" class="mut" style="margin-top:8px"></p><p style="margin-top:12px"><button class="btn pri" data-a="gate">${h?'Masuk':'Simpan dan masuk'}</button></p>`)};addEventListener('hashchange',gate);gate()}
(async()=>{try{const u=await claude.use('user');if(!u||!u.isOwner())return;art=await claude.use('artifact');unlock()}catch(e){if(typeof claude==='undefined')standalone()}})();
</script></body></html>
